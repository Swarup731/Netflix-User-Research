<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="660" fill="#0A0A0A"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="24" font-weight="bold">Component States — Default / Hover / Active / Focus</text>
  <text x="40" y="70" fill="#B3B3B3" font-size="14">Task 3 · dark surfaces used throughout so the white focus ring stays visible</text>

  <!-- Button row -->
  <text x="40" y="112" fill="#8C8C8C" font-size="13" font-weight="bold">Button/Primary</text>
  <g>
    <rect x="40" y="126" width="240" height="110" rx="6" fill="#1F1F1F"/>
    <text x="60" y="150" fill="#666" font-size="11">Default</text>
    <rect x="60" y="164" width="90" height="40" rx="4" fill="#FFFFFF"/>
    <text x="82" y="189" fill="#141414" font-size="13" font-weight="bold">Play</text>
  </g>
  <g>
    <rect x="300" y="126" width="240" height="110" rx="6" fill="#1F1F1F"/>
    <text x="320" y="150" fill="#666" font-size="11">Hover</text>
    <rect x="315" y="159" width="100" height="45" rx="4" fill="#F0F0F0"/>
    <text x="340" y="187" fill="#141414" font-size="14" font-weight="bold">Play</text>
    <text x="320" y="222" fill="#8C8C8C" font-size="9">scale 1.05, bg lightens</text>
  </g>
  <g>
    <rect x="560" y="126" width="240" height="110" rx="6" fill="#1F1F1F"/>
    <text x="580" y="150" fill="#666" font-size="11">Active</text>
    <rect x="580" y="167" width="86" height="38" rx="4" fill="#D9D9D9"/>
    <text x="600" y="191" fill="#141414" font-size="12" font-weight="bold">Play</text>
    <text x="580" y="222" fill="#8C8C8C" font-size="9">scale settles, bg darkens</text>
  </g>
  <g>
    <rect x="820" y="126" width="240" height="110" rx="6" fill="#1F1F1F"/>
    <text x="840" y="150" fill="#666" font-size="11">Focus</text>
    <rect x="837" y="161" width="94" height="42" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="833" y="157" width="102" height="50" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="857" y="187" fill="#141414" font-size="13" font-weight="bold">Play</text>
    <text x="840" y="222" fill="#8C8C8C" font-size="9">2px offset ring, remote-nav</text>
  </g>

  <!-- Chip row -->
  <text x="40" y="280" fill="#8C8C8C" font-size="13" font-weight="bold">Chip/Filter</text>
  <g>
    <rect x="40" y="294" width="240" height="90" rx="6" fill="#1F1F1F"/>
    <text x="60" y="316" fill="#666" font-size="11">Default</text>
    <rect x="60" y="328" width="90" height="32" rx="16" fill="#2B2B2B" stroke="#4D4D4D"/>
    <text x="80" y="349" fill="#FFFFFF" font-size="12">Action</text>
  </g>
  <g>
    <rect x="300" y="294" width="240" height="90" rx="6" fill="#1F1F1F"/>
    <text x="320" y="316" fill="#666" font-size="11">Hover</text>
    <rect x="320" y="328" width="90" height="32" rx="16" fill="#3D3D3D" stroke="#666"/>
    <text x="340" y="349" fill="#FFFFFF" font-size="12">Action</text>
  </g>
  <g>
    <rect x="560" y="294" width="240" height="90" rx="6" fill="#1F1F1F"/>
    <text x="580" y="316" fill="#666" font-size="11">Active / Selected</text>
    <rect x="580" y="328" width="90" height="32" rx="16" fill="#E50914"/>
    <text x="598" y="349" fill="#FFFFFF" font-size="12" font-weight="bold">Action</text>
  </g>
  <g>
    <rect x="820" y="294" width="240" height="90" rx="6" fill="#1F1F1F"/>
    <text x="840" y="316" fill="#666" font-size="11">Focus</text>
    <rect x="837" y="325" width="90" height="32" rx="16" fill="#2B2B2B" stroke="#4D4D4D"/>
    <rect x="833" y="321" width="98" height="40" rx="20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="857" y="346" fill="#FFFFFF" font-size="12">Action</text>
  </g>

  <!-- Card row -->
  <text x="40" y="440" fill="#8C8C8C" font-size="13" font-weight="bold">Card/Movie</text>
  <g>
    <rect x="40" y="454" width="240" height="160" rx="6" fill="#1F1F1F"/>
    <text x="60" y="476" fill="#666" font-size="11">Default</text>
    <rect x="60" y="488" width="200" height="100" rx="4" fill="#3A3A3A"/>
    <text x="60" y="606" fill="#FFFFFF" font-size="11">Ocean Drift</text>
  </g>
  <g>
    <rect x="300" y="454" width="240" height="160" rx="6" fill="#1F1F1F"/>
    <text x="320" y="476" fill="#666" font-size="11">Hover</text>
    <rect x="315" y="483" width="215" height="110" rx="4" fill="#3A3A3A" stroke="#666"/>
    <circle cx="422" cy="538" r="18" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="416,530 416,546 430,538" fill="#141414"/>
    <text x="320" y="613" fill="#FFFFFF" font-size="11">Ocean Drift · scale 1.05</text>
  </g>
  <g>
    <rect x="560" y="454" width="240" height="160" rx="6" fill="#1F1F1F"/>
    <text x="580" y="476" fill="#666" font-size="11">Focus (remote-nav)</text>
    <rect x="596" y="486" width="208" height="104" rx="6" fill="#3A3A3A" stroke="#FFFFFF" stroke-width="3"/>
    <text x="580" y="613" fill="#FFFFFF" font-size="11">Ocean Drift · ring, no hover needed</text>
  </g>
  <g>
    <rect x="820" y="454" width="240" height="160" rx="6" fill="#1F1F1F"/>
    <text x="840" y="476" fill="#666" font-size="11">Disabled (e.g. locked profile)</text>
    <rect x="840" y="488" width="200" height="100" rx="4" fill="#3A3A3A" opacity="0.4"/>
    <text x="840" y="606" fill="#8C8C8C" font-size="11" opacity="0.6">Ocean Drift</text>
  </g>
</svg>
