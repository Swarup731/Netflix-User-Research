<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" fill="#141414"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="24" font-weight="bold">Spacing Token Scale</text>
  <text x="40" y="70" fill="#B3B3B3" font-size="14">4px base unit · 9 steps — Task 5</text>

  <!-- bars -->
  <g font-size="11" fill="#FFFFFF">
    <!-- space/1 = 2 -->
    <rect x="60" y="120" width="2" height="20" fill="#E50914"/>
    <text x="40" y="160" text-anchor="middle">1</text>
    <text x="40" y="176" fill="#8C8C8C" text-anchor="middle">2px</text>

    <!-- space/2 = 4 -->
    <rect x="110" y="116" width="4" height="24" fill="#E50914"/>
    <text x="112" y="160" text-anchor="middle">2</text>
    <text x="112" y="176" fill="#8C8C8C" text-anchor="middle">4px</text>

    <!-- space/3 = 8 -->
    <rect x="160" y="108" width="8" height="32" fill="#E50914"/>
    <text x="164" y="160" text-anchor="middle">3</text>
    <text x="164" y="176" fill="#8C8C8C" text-anchor="middle">8px</text>

    <!-- space/4 = 12 -->
    <rect x="210" y="100" width="12" height="40" fill="#E50914"/>
    <text x="216" y="160" text-anchor="middle">4</text>
    <text x="216" y="176" fill="#8C8C8C" text-anchor="middle">12px</text>

    <!-- space/5 = 16 -->
    <rect x="260" y="92" width="16" height="48" fill="#E50914"/>
    <text x="268" y="160" text-anchor="middle">5</text>
    <text x="268" y="176" fill="#8C8C8C" text-anchor="middle">16px</text>

    <!-- space/6 = 24 -->
    <rect x="320" y="76" width="24" height="64" fill="#E50914"/>
    <text x="332" y="160" text-anchor="middle">6</text>
    <text x="332" y="176" fill="#8C8C8C" text-anchor="middle">24px</text>

    <!-- space/7 = 32 -->
    <rect x="390" y="60" width="32" height="80" fill="#E50914"/>
    <text x="406" y="160" text-anchor="middle">7</text>
    <text x="406" y="176" fill="#8C8C8C" text-anchor="middle">32px</text>

    <!-- space/8 = 48 -->
    <rect x="470" y="28" width="48" height="112" fill="#E50914"/>
    <text x="494" y="160" text-anchor="middle">8</text>
    <text x="494" y="176" fill="#8C8C8C" text-anchor="middle">48px</text>

    <!-- space/9 = 64 -->
    <rect x="570" y="-16" width="64" height="156" fill="#E50914" transform="translate(0,16)"/>
    <text x="602" y="176" text-anchor="middle">9</text>
    <text x="602" y="192" fill="#8C8C8C" text-anchor="middle">64px</text>
  </g>
  <line x1="40" y1="140" x2="700" y2="140" stroke="#333" stroke-width="1"/>

  <!-- Usage examples -->
  <text x="40" y="230" fill="#8C8C8C" font-size="13" font-weight="bold">Applied Examples</text>

  <g>
    <text x="40" y="260" fill="#B3B3B3" font-size="12">Chip padding (space/3 = 8px vertical)</text>
    <rect x="40" y="270" width="90" height="8" fill="#3D3D3D"/>
    <rect x="40" y="278" width="90" height="16" fill="#2B2B2B"/>
    <rect x="40" y="294" width="90" height="8" fill="#3D3D3D"/>
  </g>

  <g>
    <text x="220" y="260" fill="#B3B3B3" font-size="12">Row gap mobile (space/5 = 16px)</text>
    <rect x="220" y="270" width="36" height="40" fill="#3A3A3A"/>
    <rect x="272" y="270" width="16" height="40" fill="none" stroke="#E50914" stroke-dasharray="2,2"/>
    <rect x="304" y="270" width="36" height="40" fill="#3A3A3A"/>
  </g>

  <g>
    <text x="420" y="260" fill="#B3B3B3" font-size="12">Card gap flagged: measured 6px → rounded to space/3 (8px)</text>
    <rect x="420" y="270" width="80" height="30" fill="#3A3A3A"/>
    <rect x="420" y="304" width="8" height="8" fill="none" stroke="#F1C40F" stroke-dasharray="2,2"/>
    <text x="434" y="311" fill="#F1C40F" font-size="9">8px (was 6)</text>
    <text x="420" y="324" fill="#3A3A3A" font-size="1"> </text>
    <text x="420" y="326" fill="#FFFFFF" font-size="10">Card Title</text>
  </g>

  <text x="40" y="400" fill="#666" font-size="12">All tokens stored as Figma Variables — referenced directly in Auto Layout padding/gap fields, not manually applied.</text>
</svg>
