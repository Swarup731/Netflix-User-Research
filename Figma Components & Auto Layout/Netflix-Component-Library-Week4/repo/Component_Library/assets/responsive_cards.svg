<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#141414"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="24" font-weight="bold">Responsive Card Templates</text>
  <text x="40" y="70" fill="#B3B3B3" font-size="14">Same Card/Movie instance, three breakpoints — Task 4</text>

  <!-- Mobile -->
  <g>
    <rect x="40" y="100" width="220" height="460" rx="10" fill="#0A0A0A" stroke="#333" stroke-width="2"/>
    <text x="50" y="126" fill="#8C8C8C" font-size="12" font-weight="bold">Mobile · 375px</text>
    <text x="50" y="146" fill="#666" font-size="10">card 140 · gap 8 · margin 16</text>
    <text x="50" y="176" fill="#FFFFFF" font-size="13" font-weight="bold">Trending Now</text>
    <rect x="50" y="188" width="90" height="130" rx="4" fill="#3A3A3A"/>
    <rect x="148" y="188" width="90" height="130" rx="4" fill="#3A3A3A"/>
    <rect x="246" y="188" width="30" height="130" rx="4" fill="#3A3A3A" opacity="0.4"/>
    <text x="50" y="336" fill="#666" font-size="10">2.3 columns visible</text>
    <text x="50" y="366" fill="#FFFFFF" font-size="13" font-weight="bold">Continue Watching</text>
    <rect x="50" y="378" width="90" height="130" rx="4" fill="#3A3A3A"/>
    <rect x="148" y="378" width="90" height="130" rx="4" fill="#3A3A3A"/>
    <rect x="246" y="378" width="30" height="130" rx="4" fill="#3A3A3A" opacity="0.4"/>
  </g>

  <!-- Tablet -->
  <g>
    <rect x="300" y="100" width="420" height="460" rx="10" fill="#0A0A0A" stroke="#333" stroke-width="2"/>
    <text x="320" y="126" fill="#8C8C8C" font-size="12" font-weight="bold">Tablet · 768px</text>
    <text x="320" y="146" fill="#666" font-size="10">card 160 · gap 12 · margin 24</text>
    <text x="320" y="176" fill="#FFFFFF" font-size="13" font-weight="bold">Trending Now</text>
    <rect x="320" y="188" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="432" y="188" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="544" y="188" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="656" y="188" width="45" height="140" rx="4" fill="#3A3A3A" opacity="0.4"/>
    <text x="320" y="346" fill="#666" font-size="10">4.2 columns visible</text>
    <text x="320" y="376" fill="#FFFFFF" font-size="13" font-weight="bold">Continue Watching</text>
    <rect x="320" y="388" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="432" y="388" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="544" y="388" width="100" height="140" rx="4" fill="#3A3A3A"/>
    <rect x="656" y="388" width="45" height="140" rx="4" fill="#3A3A3A" opacity="0.4"/>
  </g>

  <!-- Desktop -->
  <g>
    <rect x="760" y="100" width="400" height="460" rx="10" fill="#0A0A0A" stroke="#333" stroke-width="2"/>
    <text x="780" y="126" fill="#8C8C8C" font-size="12" font-weight="bold">Desktop · 1440px (cropped)</text>
    <text x="780" y="146" fill="#666" font-size="10">card 200 · gap 16 · margin 48</text>
    <text x="780" y="176" fill="#FFFFFF" font-size="13" font-weight="bold">Trending Now</text>
    <rect x="780" y="188" width="120" height="150" rx="4" fill="#3A3A3A"/>
    <rect x="916" y="188" width="120" height="150" rx="4" fill="#3A3A3A"/>
    <rect x="1052" y="188" width="60" height="150" rx="4" fill="#3A3A3A" opacity="0.4"/>
    <text x="780" y="366" fill="#666" font-size="10">6.5 columns visible in full viewport</text>
    <text x="780" y="396" fill="#FFFFFF" font-size="13" font-weight="bold">Continue Watching</text>
    <rect x="780" y="408" width="120" height="150" rx="4" fill="#3A3A3A"/>
    <rect x="916" y="408" width="120" height="150" rx="4" fill="#3A3A3A"/>
    <rect x="1052" y="408" width="60" height="150" rx="4" fill="#3A3A3A" opacity="0.4"/>
  </g>

  <text x="40" y="595" fill="#666" font-size="12">Card component identity is fixed across all three — only grid tokens (width, gap, margin) change per breakpoint.</text>
</svg>
