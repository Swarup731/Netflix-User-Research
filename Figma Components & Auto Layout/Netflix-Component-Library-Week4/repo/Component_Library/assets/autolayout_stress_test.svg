<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#141414"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="24" font-weight="bold">Auto Layout Stress Test</text>
  <text x="40" y="70" fill="#B3B3B3" font-size="14">Same component, short vs. long content — Task 2</text>

  <!-- Button hug width test -->
  <text x="40" y="112" fill="#8C8C8C" font-size="13" font-weight="bold">Button/Primary — Width: Hug contents</text>

  <rect x="40" y="130" width="200" height="110" rx="6" fill="#1F1F1F" stroke="#333"/>
  <text x="60" y="156" fill="#666" font-size="11">short label</text>
  <rect x="60" y="170" width="80" height="40" rx="4" fill="#FFFFFF"/>
  <text x="82" y="195" fill="#141414" font-size="13" font-weight="bold">Play</text>
  <line x1="60" y1="215" x2="140" y2="215" stroke="#E50914" stroke-dasharray="3,3"/>
  <text x="60" y="230" fill="#E50914" font-size="10">width = content + 24px padding</text>

  <rect x="270" y="130" width="420" height="110" rx="6" fill="#1F1F1F" stroke="#333"/>
  <text x="290" y="156" fill="#666" font-size="11">long label — same component</text>
  <rect x="290" y="170" width="360" height="40" rx="4" fill="#FFFFFF"/>
  <text x="312" y="195" fill="#141414" font-size="13" font-weight="bold">Find Something to Watch Tonight</text>
  <line x1="290" y1="215" x2="650" y2="215" stroke="#E50914" stroke-dasharray="3,3"/>
  <text x="290" y="230" fill="#E50914" font-size="10">width grows, same 24px padding — no manual resize</text>

  <text x="740" y="185" fill="#2ECC71" font-size="30">✓</text>
  <text x="740" y="205" fill="#2ECC71" font-size="11">Both correct</text>

  <!-- ListItem fill width / hug height test -->
  <text x="40" y="300" fill="#8C8C8C" font-size="13" font-weight="bold">ListItem/Episode — Width: Fill container · Height: Hug contents</text>

  <rect x="40" y="320" width="500" height="90" rx="6" fill="#1F1F1F" stroke="#333"/>
  <text x="60" y="342" fill="#666" font-size="11">short title (1 line)</text>
  <rect x="60" y="352" width="60" height="40" rx="4" fill="#3A3A3A"/>
  <text x="132" y="368" fill="#FFFFFF" font-size="12" font-weight="bold">S1 E4 · Undertow</text>
  <text x="132" y="384" fill="#8C8C8C" font-size="10">43m</text>
  <line x1="60" y1="404" x2="500" y2="404" stroke="#E50914" stroke-dasharray="3,3"/>

  <rect x="580" y="320" width="580" height="130" rx="6" fill="#1F1F1F" stroke="#333"/>
  <text x="600" y="342" fill="#666" font-size="11">long title (wraps to 2 lines) — same component</text>
  <rect x="600" y="356" width="60" height="40" rx="4" fill="#3A3A3A"/>
  <text x="672" y="368" fill="#FFFFFF" font-size="12" font-weight="bold">S2 E11 · The Longest Night We</text>
  <text x="672" y="384" fill="#FFFFFF" font-size="12" font-weight="bold">Ever Spent Waiting for the Tide</text>
  <text x="672" y="400" fill="#8C8C8C" font-size="10">1h 12m</text>
  <line x1="600" y1="440" x2="1140" y2="440" stroke="#E50914" stroke-dasharray="3,3"/>
  <text x="600" y="455" fill="#E50914" font-size="10">row height grows to fit — text never clips, layout never breaks</text>

  <text x="1080" y="380" fill="#2ECC71" font-size="30">✓</text>

  <text x="40" y="510" fill="#666" font-size="12">Failure modes this prevents: dead space around short content (fixed-width) and clipped/overflowing long content (fixed-height).</text>
</svg>
